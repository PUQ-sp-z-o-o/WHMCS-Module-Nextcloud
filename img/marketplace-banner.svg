<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0082c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a4e4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00a4e4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0082c9;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="500" height="8" fill="url(#accent)"/>

  <!-- Ambient Glow behind Cloud -->
  <circle cx="250" cy="140" r="90" fill="#0082c9" opacity="0.12" />
  <circle cx="250" cy="140" r="60" fill="#00a4e4" opacity="0.15" />

  <!-- Cloud + Storage + Sync Icon (Centered at X=250, Y=140) -->
  <g transform="translate(250, 135)">
    <!-- Outer Cloud Contour -->
    <path d="M40,-5 C40,-35 15,-55 -15,-55 C-38,-55 -55,-40 -60,-20 C-80,-20 -95,-5 -95,15 C-95,35 -80,50 -60,50 L55,50 C75,50 90,35 90,15 C90,-3 75,-18 58,-20 C54,-20 48,-20 40,-5 Z"
          fill="url(#cloudGrad)"
          stroke="#00a4e4"
          stroke-width="3.5"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- Storage Folder in Center of Cloud -->
    <g transform="translate(-32, -8)">
      <!-- Folder Tab & Body -->
      <path d="M0,8 L0,2 C0,-1 2,-3 5,-3 L22,-3 C25,-3 27,-1 29,1 L34,7 L59,7 C62,7 64,9 64,12 L64,42 C64,45 62,47 59,47 L5,47 C2,47 0,45 0,42 Z"
            fill="#16213e"
            fill-opacity="0.75"
            stroke="#00a4e4"
            stroke-width="2.5"
            stroke-linejoin="round"/>
      <line x1="0" y1="12" x2="64" y2="12" stroke="#00a4e4" stroke-width="2" opacity="0.7"/>

      <!-- Inner mini document / storage bar -->
      <rect x="12" y="20" width="40" height="4" rx="2" fill="#7dd3fc" opacity="0.8"/>
      <rect x="12" y="28" width="26" height="4" rx="2" fill="#7dd3fc" opacity="0.5"/>
    </g>

    <!-- Nextcloud Node Circles (Signature 3-Node Connected Motif) -->
    <!-- Left Node -->
    <circle cx="-62" cy="18" r="8" fill="#1a1a2e" stroke="#00a4e4" stroke-width="2.5"/>
    <circle cx="-62" cy="18" r="3.5" fill="#7dd3fc"/>

    <!-- Right Node -->
    <circle cx="62" cy="18" r="8" fill="#1a1a2e" stroke="#00a4e4" stroke-width="2.5"/>
    <circle cx="62" cy="18" r="3.5" fill="#7dd3fc"/>

    <!-- Top Node -->
    <circle cx="-15" cy="-55" r="7" fill="#1a1a2e" stroke="#00a4e4" stroke-width="2.5"/>
    <circle cx="-15" cy="-55" r="3" fill="#7dd3fc"/>

    <!-- Sync Arrows at bottom -->
    <g transform="translate(0, 68)">
      <!-- Left-to-right arrow -->
      <path d="M-22,-4 C-10,-10 10,-10 22,-4" fill="none" stroke="#00a4e4" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="24,-9 26,-2 19,-3" fill="#00a4e4"/>
      <!-- Right-to-left arrow -->
      <path d="M22,4 C10,10 -10,10 -22,4" fill="none" stroke="#0082c9" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="-24,9 -26,2 -19,3" fill="#0082c9"/>
    </g>
  </g>

  <!-- Module Name (Big & Readable) -->
  <text x="250" y="300" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">NEXTCLOUD</text>

  <!-- Subtitle -->
  <text x="250" y="352" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">WHMCS SERVER MODULE</text>

  <!-- Separator -->
  <rect x="180" y="378" width="140" height="4" fill="#0082c9" rx="2"/>

  <!-- PUQ Software Branding -->
  <g transform="translate(175, 415)">
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0082c9">PUQ</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Software</text>
  </g>
</svg>
